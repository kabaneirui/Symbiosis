<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Symbiosis - AI 陪伴</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #13141f; color: #eaeaf0; height: 100vh; overflow: hidden; }

/* 登录页 */
#loginPage { display: flex; align-items: center; justify-content: center; height: 100vh; background: linear-gradient(135deg, #13141f 0%, #1a1b2e 100%); }
.login-card { background: rgba(22,24,38,0.95); border: 1px solid rgba(90,130,200,0.2); border-radius: 20px; padding: 40px 30px; width: 320px; text-align: center; }
.login-card h1 { color: #e5c870; font-size: 28px; margin-bottom: 8px; }
.login-card p { color: #8888a0; font-size: 14px; margin-bottom: 30px; }
.login-card input { width: 100%; padding: 14px 18px; border-radius: 12px; border: 1px solid rgba(90,130,200,0.3); background: rgba(18,18,30,0.9); color: #eee; font-size: 16px; outline: none; margin-bottom: 18px; }
.login-card input:focus { border-color: #5a82c8; }
.login-card button { width: 100%; padding: 14px; border-radius: 12px; border: none; background: linear-gradient(135deg, #4a6eb5, #5a8ad8); color: white; font-size: 17px; font-weight: 600; cursor: pointer; }
.login-card button:active { transform: scale(0.97); }
#loginStatus { color: #8888a0; font-size: 13px; margin-top: 12px; }

/* 主页面 */
#mainPage { display: none; height: 100vh; flex-direction: column; }

/* 状态栏 */
.status-bar { background: rgba(16,16,28,0.96); padding: 10px 16px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid rgba(90,130,200,0.15); flex-shrink: 0; }
.status-bar .name { color: #e5c870; font-weight: 700; font-size: 17px; }
.favor-bar { flex: 1; height: 6px; background: rgba(40,40,60,0.8); border-radius: 3px; overflow: hidden; }
.favor-bar .fill { height: 100%; background: linear-gradient(90deg, #4a6eb5, #6ba3e8); border-radius: 3px; transition: width 0.5s; }
.status-bar .favor-num { color: #ccc; font-size: 13px; }
.status-bar .stage { color: #5a8ad8; font-size: 13px; font-weight: 500; }
.status-bar .coins { color: #e5c870; font-size: 13px; margin-left: auto; }

/* 聊天区 */
.chat-area { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.msg { display: flex; gap: 10px; max-width: 85%; animation: fadeIn 0.3s; }
.msg.user { align-self: flex-end; flex-direction: row-reverse; }
.msg.ai { align-self: flex-start; }
.msg.system { align-self: center; max-width: 90%; }
.msg .avatar { width: 36px; height: 36px; border-radius: 50%; background: #2a2b3a; flex-shrink: 0; overflow: hidden; }
.msg .avatar img { width: 100%; height: 100%; object-fit: cover; }
.msg .bubble { padding: 12px 16px; border-radius: 16px; font-size: 15px; line-height: 1.6; word-break: break-word; }
.msg.user .bubble { background: rgba(70,100,170,0.8); border-bottom-right-radius: 4px; }
.msg.ai .bubble { background: rgba(28,30,45,0.9); border: 1px solid rgba(90,130,200,0.15); border-bottom-left-radius: 4px; }
.msg.system .bubble { background: none; color: #6a9a5a; font-size: 13px; text-align: center; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

/* 输入栏 */
.input-bar { background: rgba(16,16,28,0.96); padding: 10px 12px; display: flex; gap: 8px; border-top: 1px solid rgba(90,130,200,0.15); flex-shrink: 0; }
.input-bar input { flex: 1; padding: 12px 16px; border-radius: 22px; border: 1px solid rgba(90,130,200,0.2); background: rgba(18,18,30,0.9); color: #eee; font-size: 15px; outline: none; }
.input-bar input:focus { border-color: #5a82c8; }
.input-bar button { padding: 10px 18px; border-radius: 22px; border: none; font-size: 14px; font-weight: 600; cursor: pointer; }
.btn-send { background: linear-gradient(135deg, #4a6eb5, #5a8ad8); color: white; }
.btn-shop { background: linear-gradient(135deg, #c87a30, #d89545); color: white; }
.btn-send:active, .btn-shop:active { transform: scale(0.95); }

/* 商店弹窗 */
.modal-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.6); z-index: 100; align-items: center; justify-content: center; }
.modal-overlay.active { display: flex; }
.shop-modal { background: #181a28; border: 1px solid rgba(90,130,200,0.2); border-radius: 20px; width: 92%; max-width: 400px; max-height: 85vh; overflow-y: auto; padding: 24px 20px; }
.shop-modal h2 { color: #e5c870; font-size: 20px; margin-bottom: 4px; }
.shop-modal .shop-coins { color: #e5c870; font-size: 14px; margin-bottom: 16px; }
.shop-section { margin-bottom: 18px; }
.shop-section h3 { color: #8ab4e8; font-size: 14px; margin-bottom: 10px; }
.shop-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.shop-item { background: rgba(30,32,48,0.9); border: 1px solid rgba(90,130,200,0.1); border-radius: 12px; padding: 12px 8px; text-align: center; cursor: pointer; transition: all 0.2s; }
.shop-item:active { transform: scale(0.95); border-color: #5a8ad8; }
.shop-item .item-name { color: #eee; font-size: 14px; margin-bottom: 4px; }
.shop-item .item-cost { color: #e5c870; font-size: 12px; }
.shop-item .item-hint { color: #6a9a5a; font-size: 11px; margin-top: 3px; }
.mystery-btn { width: 100%; padding: 14px; border-radius: 14px; border: none; background: linear-gradient(135deg, #6a45a5, #8b60c8); color: white; font-size: 15px; font-weight: 600; cursor: pointer; margin-top: 10px; }
.shop-close { position: absolute; top: 16px; right: 20px; background: none; border: none; color: #888; font-size: 24px; cursor: pointer; }
.shop-msg { color: #6a9a5a; font-size: 13px; text-align: center; margin-top: 10px; min-height: 20px; }

/* 加载态 */
.typing { color: #8888a0; font-size: 13px; padding: 4px 0; animation: blink 1s infinite; }
@keyframes blink { 50% { opacity: 0.4; } }
</style>
</head>
<body>

<!-- 登录页 -->
<div id="loginPage">
  <div class="login-card">
    <h1>Symbiosis</h1>
    <p>你的 AI 伙伴在等你</p>
    <input id="nicknameInput" placeholder="输入你的名字..." maxlength="20">
    <button onclick="login()">进入世界</button>
    <div id="loginStatus"></div>
  </div>
</div>

<!-- 主页面 -->
<div id="mainPage">
  <div class="status-bar">
    <span class="name" id="charName">小星</span>
    <div class="favor-bar"><div class="fill" id="favorFill" style="width:0%"></div></div>
    <span class="favor-num" id="favorNum">0</span>
    <span class="stage" id="stageText">陌生</span>
    <span class="coins" id="coinsText">0 心意</span>
  </div>

  <div class="chat-area" id="chatArea"></div>

  <div class="input-bar">
    <input id="chatInput" placeholder="说点什么吧..." enterkeyhint="send">
    <button class="btn-send" onclick="sendChat()">发送</button>
    <button class="btn-shop" onclick="openShop()">商店</button>
  </div>
</div>

<!-- 商店弹窗 -->
<div class="modal-overlay" id="shopModal">
  <div class="shop-modal" style="position:relative">
    <button class="shop-close" onclick="closeShop()">&times;</button>
    <h2>商店</h2>
    <div class="shop-coins" id="shopCoins">0 心意</div>
    <div id="shopMsg" class="shop-msg"></div>

    <div class="shop-section">
      <h3>她可能喜欢</h3>
      <div class="shop-grid" id="recommendGrid"></div>
    </div>

    <div class="shop-section">
      <h3>每日精选 (7折)</h3>
      <div class="shop-grid" id="dailyGrid"></div>
    </div>

    <button class="mystery-btn" onclick="openMystery()">神秘盒子 (30 心意)</button>
  </div>
</div>

<script>
const API = location.origin;
let userId = 0;
let coins = 0;

// 登录
async function login() {
  const name = document.getElementById('nicknameInput').value.trim() || '用户';
  document.getElementById('loginStatus').textContent = '连接中...';
  try {
    const res = await fetch(API + '/user/init', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({nickname: name})
    });
    const data = await res.json();
    userId = data.user_id;

    // 获取状态
    const stateRes = await fetch(API + '/state?user_id=' + userId);
    const state = await stateRes.json();
    updateStatus(state);

    // 获取商店（触发登录奖励）
    const shopRes = await fetch(API + '/shop?user_id=' + userId);
    const shop = await shopRes.json();
    coins = shop.coins || 0;
    document.getElementById('coinsText').textContent = coins + ' 心意';

    // 切换页面
    document.getElementById('loginPage').style.display = 'none';
    document.getElementById('mainPage').style.display = 'flex';

    if (shop.login_message) addSystem(shop.login_message);
    addSystem('当前心意: ' + coins);
    addAI(data.message);
  } catch(e) {
    document.getElementById('loginStatus').textContent = '连接失败: ' + e.message;
  }
}

// 发送聊天
async function sendChat() {
  const input = document.getElementById('chatInput');
  const msg = input.value.trim();
  if (!msg) return;
  input.value = '';
  addUser(msg);
  showTyping();
  try {
    const res = await fetch(API + '/chat', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({user_id: userId, message: msg})
    });
    hideTyping();
    if (!res.ok) {
      const err = await res.text();
      addSystem('发送失败: ' + err.substring(0, 100));
      return;
    }
    const data = await res.json();
    if (data && data.reply) {
      addAI(data.reply);
      updateStatus(data);
      addSystem('聊天 +5 心意');
      coins += 5;
      document.getElementById('coinsText').textContent = coins + ' 心意';
    } else {
      addSystem('回复异常: ' + JSON.stringify(data).substring(0, 100));
    }
  } catch(e) {
    hideTyping();
    addSystem('发送失败: ' + e.message);
  }
}

// 回车发送
document.getElementById('chatInput').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') { e.preventDefault(); sendChat(); }
});

// 商店
async function openShop() {
  document.getElementById('shopModal').classList.add('active');
  try {
    const res = await fetch(API + '/shop?user_id=' + userId);
    const data = await res.json();
    coins = data.coins || 0;
    document.getElementById('shopCoins').textContent = coins + ' 心意';
    document.getElementById('coinsText').textContent = coins + ' 心意';

    renderGrid('recommendGrid', data.recommended || [], true);
    renderGrid('dailyGrid', data.daily_special || [], false);
  } catch(e) {}
}
function closeShop() { document.getElementById('shopModal').classList.remove('active'); }

function renderGrid(id, items, showHint) {
  const grid = document.getElementById(id);
  grid.innerHTML = '';
  items.forEach(item => {
    const div = document.createElement('div');
    div.className = 'shop-item';
    div.innerHTML = '<div class="item-name">' + item.name + '</div>'
      + '<div class="item-cost">' + item.cost + ' 心意</div>'
      + (showHint && item.hint ? '<div class="item-hint">' + item.hint + '</div>' : '')
      + (item.discount ? '<div class="item-hint">' + item.discount + '</div>' : '');
    div.onclick = () => buyGift(item.id, item.name);
    grid.appendChild(div);
  });
}

async function buyGift(giftId, giftName) {
  try {
    const res = await fetch(API + '/gift', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({user_id: userId, gift_id: giftId})
    });
    if (!res.ok) { document.getElementById('shopMsg').textContent = '心意不足'; return; }
    const data = await res.json();
    closeShop();
    addAI(data.reply);
    addSystem('送出' + giftName + '  好感+' + data.favor_delta);
    updateStatus(data);
    const shopRes = await fetch(API + '/shop?user_id=' + userId);
    const shop = await shopRes.json();
    coins = shop.coins || 0;
    document.getElementById('coinsText').textContent = coins + ' 心意';
  } catch(e) {
    document.getElementById('shopMsg').textContent = '送礼失败';
  }
}

async function openMystery() {
  try {
    const res = await fetch(API + '/shop/mystery', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({user_id: userId})
    });
    if (!res.ok) { document.getElementById('shopMsg').textContent = '心意不足(需30)'; return; }
    const data = await res.json();
    coins = data.coins_remaining;
    document.getElementById('shopCoins').textContent = coins + ' 心意';
    document.getElementById('coinsText').textContent = coins + ' 心意';
    document.getElementById('shopMsg').textContent = '获得: ' + data.gift_name + ' (' + data.rarity + ')';
  } catch(e) {}
}

// 状态更新
function updateStatus(data) {
  if (data.favorability !== undefined) {
    document.getElementById('favorNum').textContent = data.favorability;
    const max = data.favorability < 50 ? 50 : data.favorability < 100 ? 100 : data.favorability < 200 ? 200 : 500;
    document.getElementById('favorFill').style.width = Math.min(100, data.favorability / max * 100) + '%';
  }
  if (data.favor_stage) {
    const names = {stranger:'陌生',familiar:'熟悉',dependent:'依赖',intimate:'亲密'};
    document.getElementById('stageText').textContent = names[data.favor_stage] || data.favor_stage;
  }
}

// 消息
function addUser(text) { addMsg('user', text); }
function addAI(text) { addMsg('ai', text); }
function addSystem(text) { addMsg('system', text); }

function addMsg(type, text) {
  const area = document.getElementById('chatArea');
  const div = document.createElement('div');
  div.className = 'msg ' + type;

  if (type === 'ai') {
    div.innerHTML = '<div class="avatar"><img src="data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMzYiIGhlaWdodD0iMzYiIHZpZXdCb3g9IjAgMCAzNiAzNiIgZmlsbD0ibm9uZSIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj48Y2lyY2xlIGN4PSIxOCIgY3k9IjE4IiByPSIxOCIgZmlsbD0iIzJhMmIzYSIvPjx0ZXh0IHg9IjE4IiB5PSIyNCIgdGV4dC1hbmNob3I9Im1pZGRsZSIgZmlsbD0iI2U1Yzg3MCIgZm9udC1zaXplPSIxOCI+4piFPC90ZXh0Pjwvc3ZnPg==" alt=""></div>'
      + '<div class="bubble">' + escapeHtml(text) + '</div>';
  } else if (type === 'user') {
    div.innerHTML = '<div class="bubble">' + escapeHtml(text) + '</div>';
  } else {
    div.innerHTML = '<div class="bubble">--- ' + escapeHtml(text) + ' ---</div>';
  }
  area.appendChild(div);
  area.scrollTop = area.scrollHeight;
}

let typingEl = null;
function showTyping() {
  const area = document.getElementById('chatArea');
  typingEl = document.createElement('div');
  typingEl.className = 'typing';
  typingEl.textContent = '小星正在思考...';
  area.appendChild(typingEl);
  area.scrollTop = area.scrollHeight;
}
function hideTyping() { if (typingEl) { typingEl.remove(); typingEl = null; } }

function escapeHtml(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
</script>
</body>
</html>
